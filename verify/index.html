<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stamp verification — Gude</title>
<meta name="description" content="Verify professional engineering stamp codes on Gude plan sets. Scan the QR code beside the stamp or enter your verification code.">
<link rel="stylesheet" href="../brand/theme.css">
<link rel="icon" href="../brand/favicon.svg?v=4" type="image/svg+xml">
<link rel="icon" href="../brand/favicon.ico?v=4" sizes="16x16 32x32">
<link rel="apple-touch-icon" href="../brand/apple-touch-icon.png?v=4">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Arial, Helvetica, sans-serif; line-height: 1.55; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 40px; }
  .site-header { padding: 28px 0; }
  .site-header .wrap {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
  }
  .nav-lanes { font-size: 11px; letter-spacing: 0.06em; }
  .nav-lanes a { text-decoration: none; }
  .nav-lanes .sep { padding: 0 8px; }

  .verify-page {
    max-width: 640px;
    padding: 48px 0 72px;
  }

  .verify-kicker {
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--port-red);
    font-weight: 700;
    margin-bottom: 12px;
  }

  .verify-title {
    font-size: clamp(24px, 5vw, 28px);
    letter-spacing: 0.06em;
    font-weight: 700;
    color: var(--garnet-black);
    margin-bottom: 16px;
  }

  .verify-lead {
    font-size: 15px;
    color: var(--iron-ash);
    margin-bottom: 20px;
    max-width: 36em;
  }

  .verify-code-display {
    font-family: ui-monospace, "Cascadia Code", "Segoe UI Mono", monospace;
    font-size: 15px;
    letter-spacing: 0.04em;
    color: var(--garnet-black);
    background: #FAF7F7;
    border-left: 3px solid var(--port-red);
    padding: 10px 14px;
    margin-bottom: 24px;
    word-break: break-all;
  }

  .verify-status {
    font-size: 14px;
    line-height: 1.5;
    padding: 14px 16px;
    margin-bottom: 20px;
    border-radius: 4px;
  }
  .verify-status strong { display: block; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 4px; }
  .verify-status--ok {
    background: #eef6ee;
    border: 1px solid #b8d4b8;
    color: #1a3d1a;
  }
  .verify-status--warn {
    background: #fdf6e8;
    border: 1px solid #e8d4a8;
    color: #5c4a12;
  }
  .verify-status--bad {
    background: #fdf0f0;
    border: 1px solid #e8b8b8;
    color: #5c1a1a;
  }

  .verify-sample-banner {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--port-red);
    background: #fff5f5;
    border: 1px dashed var(--port-red);
    padding: 12px 14px;
    margin-bottom: 20px;
  }

  .verify-dl { margin: 0 0 28px; }
  .verify-row {
    display: grid;
    grid-template-columns: minmax(0, 11em) 1fr;
    gap: 8px 20px;
    padding: 14px 0;
    border-bottom: 1px solid #E4DCDC;
  }
  .verify-row dt {
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-weight: 700;
    color: var(--iron-ash);
  }
  .verify-row dd {
    font-size: 15px;
    color: var(--garnet-black);
    margin: 0;
  }

  .verify-disclaimer,
  .verify-help {
    font-size: 13px;
    color: var(--iron-ash);
    max-width: 36em;
  }
  .verify-help a { color: var(--port-red); }

  .verify-panel--missing .verify-title { color: var(--port-red); }

  @media (max-width: 520px) {
    .wrap { padding: 0 24px; }
    .verify-row { grid-template-columns: 1fr; gap: 4px; }
  }
</style>
</head>
<body class="lane">
<header class="site-header">
  <div class="wrap">
    <a class="wordmark" href="https://gude.co" aria-label="Gude"><img class="logo-mark" src="../brand/gude-logo-white.svg" alt=""></a>
    <nav class="nav-lanes" aria-label="Service lanes">
      <a href="https://evaluation.gude.co">Evaluation</a><span class="sep">+</span>
      <a href="https://dixon.gude.co">Engineering</a><span class="sep">+</span>
      <a href="https://plans.gude.co">Plan Review</a>
    </nav>
  </div>
</header>
<main class="band-light">
  <div class="wrap">
    <div class="verify-page">
      <div id="verify-root" aria-live="polite">
        <p class="verify-kicker">Stamp verification</p>
        <h1 class="verify-title">Loading…</h1>
      </div>
    </div>
  </div>
</main>
<footer class="site-footer">
  <div class="footer-bar">
    <a class="wordmark footer-mark" href="https://gude.co" aria-label="Gude">
      <img class="logo-mark" src="../brand/gude-logo-white.svg" alt="">
    </a>
    <div class="footer-end">
      <nav class="footer-links" aria-label="Legal">
        <a href="https://gude.co/privacy">Privacy Policy</a><span class="sep">|</span>
        <a href="https://gude.co/terms">Terms of Use</a><span class="sep">|</span>
        <a href="https://gude.co/contact">Contact Us</a>
      </nav>
      <p class="legal">&copy; 2016 Gude. All rights reserved.</p>
    </div>
  </div>
</footer>
<script src="verify.js"></script>
</body>
</html>
