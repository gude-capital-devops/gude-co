<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gude</title>
<meta name="description" content="Gude — engineering, plan review, and product evaluation. One brand, three lanes.">
<link rel="stylesheet" href="brand/theme.css">
<link rel="icon" href="brand/favicon.svg?v=2" type="image/svg+xml">
<link rel="icon" href="favicon.ico?v=2" sizes="16x16 32x32">
<link rel="apple-touch-icon" href="brand/apple-touch-icon.png?v=2">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    font-family: Arial, Helvetica, sans-serif;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  .band {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    max-width: 1180px;
    width: 100%;
    margin: 0 auto;
    padding: 56px 40px 32px;
  }

  /* ── Top row: wordmark ───────────────────────────────────── */
  .top {
    display: flex;
    align-items: flex-start;
  }

  .wordmark { text-decoration: none; color: var(--ink); }

  .wordmark .gude {
    font-size: 44px;
    font-weight: 700;
    letter-spacing: 0.18em;
    line-height: 1;
    display: block;
  }

  .wordmark .rule {
    display: block;
    width: 64px;
    height: 3px;
    background: var(--accent);
    margin-top: 12px;
  }

  /* ── Lane strip ────────────────────────────────────────────── */
  .lanes { margin: 72px 0 0; }

  .lanes .label-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 24px;
    margin-bottom: 44px;
  }

  .lanes .label-row .line {
    flex: 1;
    height: 1px;
    background: var(--hairline);
  }

  .lanes .label-row .label {
    font-size: 12px;
    letter-spacing: 0.06em;
    color: var(--ink);
    white-space: nowrap;
    text-align: center;
  }

  .lanes .label-row .label a {
    color: var(--ink);
    text-decoration: none;
  }

  .lanes .label-row .label a:hover { color: var(--accent-hover); }

  .lanes .label-row .label .sep {
    color: var(--muted);
    padding: 0 10px;
  }

  .brands {
    display: flex;
    align-items: center;
    justify-content: space-around;
    gap: 40px;
    flex-wrap: wrap;
  }

  .brands a {
    display: block;
    opacity: 0.88;
    transition: opacity 0.15s ease;
  }

  .brands a:hover { opacity: 1; }

  .brands svg { display: block; height: 88px; width: auto; }

  /* ── Contact ─────────────────────────────────────────────── */
  .contact {
    text-align: center;
  }

  .contact a {
    display: inline-block;
    padding: 14px 28px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.07em;
    text-decoration: none;
    border-radius: 6px;
    background: var(--accent);
    color: var(--bg);
    transition: background 0.22s ease, box-shadow 0.22s ease, transform 0.16s ease;
  }

  .contact a:hover {
    background: var(--accent-hover);
    box-shadow: 0 6px 18px var(--btn-shadow);
    transform: translateY(-1px);
    color: var(--bg);
  }

  /* ── Bottom group: contact + footer links ──────────────────── */
  .bottom { padding-top: 56px; }

  /* ── Footer links (shared layout is in theme.css) ─────────── */

  @media (max-width: 720px) {
    .band { padding: 40px 24px 24px; }
    .top { align-items: center; }
    .lanes { margin-top: 56px; }
    .lanes .label-row .label { white-space: normal; line-height: 1.8; }
    .brands { gap: 36px; }
    .brands svg { height: 72px; }
    .bottom { padding-top: 44px; }
  }
</style>
</head>
<body>

<main class="band">

  <!-- Top: wordmark -->
  <div class="top">
    <a class="wordmark" href="https://gude.co" aria-label="Gude">
      <span class="gude">GUDE</span>
      <span class="rule"></span>
    </a>
  </div>

  <!-- Lane strip -->
  <section class="lanes" aria-label="Gude service lanes">
    <div class="label-row">
      <span class="label">
        <a href="https://evaluation.gude.co">Evaluation</a><span class="sep">+</span><a href="https://dixon.gude.co">Engineering</a><span class="sep">+</span><a href="https://plans.gude.co">Plan Review</a>
      </span>
    </div>

    <div class="brands">

      <!-- Product READY — evaluation & future certification
           Construction (per GENERAL CODE): lighter tracked word over a heavy
           boxed word; top word width-matched to the box, box stroke matched
           to the light word's letter stroke, snug even padding inside box. -->
      <a href="https://evaluation.gude.co" aria-label="Product READY — evaluation and certification">
        <svg viewBox="0 0 220 120" xmlns="http://www.w3.org/2000/svg" role="img">
          <title>Product READY</title>
          <g fill="currentColor">
            <text x="113" y="44" text-anchor="middle"
                  font-family="Arial, Helvetica, sans-serif" font-size="26"
                  font-weight="700" letter-spacing="7">PRODUCT</text>
            <rect x="20" y="56" width="180" height="52" fill="none" stroke="currentColor" stroke-width="4"/>
            <text x="112" y="96" text-anchor="middle"
                  font-family="'Arial Black', Arial, Helvetica, sans-serif" font-size="40"
                  font-weight="900" letter-spacing="4">READY</text>
          </g>
        </svg>
      </a>

      <!-- GUDE / DIXON — engineering (layered lockup)
           Construction (per ICC SKGA layering): background GUDE emblem —
           structural arch with grid ribs — partially occluded by a heavier
           foreground DIXON panel filled with the page background, so DIXON
           reads as sitting in front of / inside of Gude. Stacked two-line
           name right, centered on the panel mass. -->
      <a href="https://dixon.gude.co" aria-label="Dixon Engineering — a Gude company">
        <svg viewBox="0 0 300 120" xmlns="http://www.w3.org/2000/svg" role="img">
          <title>Dixon Engineering — a Gude company</title>
          <!-- background layer: GUDE tile (lighter stroke = behind) with a thin
               inner inset line; the foreground panel visibly cuts the inset,
               selling the occlusion -->
          <rect x="30" y="16" width="84" height="84" fill="none" stroke="currentColor" stroke-width="4"/>
          <rect x="38" y="24" width="68" height="68" fill="none" stroke="currentColor" stroke-width="1.5"/>
          <text x="72" y="45" text-anchor="middle" fill="currentColor"
                font-family="Arial, Helvetica, sans-serif" font-size="15"
                font-weight="800" letter-spacing="2">GUDE</text>
          <!-- foreground layer: DIXON panel, bg fill occludes the tile,
               juts past the tile's left edge (heavier stroke = in front) -->
          <rect x="12" y="58" width="78" height="32" fill="var(--bg)" stroke="currentColor" stroke-width="5"/>
          <text x="51" y="80" text-anchor="middle" fill="currentColor"
                font-family="Arial, Helvetica, sans-serif" font-size="15"
                font-weight="800" letter-spacing="2">DIXON</text>
          <!-- stacked name: heavy DIXON width-matched over tracked ENGINEERING,
               block optically centered on the emblem mass -->
          <text x="132" y="57" fill="currentColor" stroke="none"
                font-family="'Arial Black', Arial, Helvetica, sans-serif" font-size="30"
                font-weight="900" textLength="150" lengthAdjust="spacing">DIXON</text>
          <text x="132" y="79" fill="currentColor" stroke="none"
                font-family="Arial, Helvetica, sans-serif" font-size="19"
                font-weight="700" textLength="150" lengthAdjust="spacing">ENGINEERING</text>
        </svg>
      </a>

      <!-- CALIFORNIA MODULAR (CMDAA) — housed word lockup
           Construction (per GENERAL CODE hierarchy under the NTA roof):
           light tracked CALIFORNIA over heavy MODULAR, both width-matched to
           one measure; roofline spans the lockup with stepped stubs bracketing
           its top outer corners; thinner ground stroke registered to the
           roof feet closes the house. -->
      <a href="https://plans.gude.co" aria-label="California Modular (CMDAA) — plan review and approval">
        <svg viewBox="0 0 220 120" xmlns="http://www.w3.org/2000/svg" role="img">
          <title>California Modular — CMDAA</title>
          <!-- ground stroke (thinner = behind), width registered to the roof feet -->
          <line x1="20" y1="104" x2="200" y2="104" stroke="currentColor"
                stroke-width="4" stroke-linecap="square"/>
          <!-- roofline; the stepped ends drop past the top line's cap height,
               bracketing the lockup's outer corners -->
          <polyline points="20,62 20,44 110,12 200,44 200,62" stroke="currentColor" fill="none"
                    stroke-width="8" stroke-linecap="square"/>
          <!-- width-matched two-line lockup -->
          <text x="29" y="58" fill="currentColor"
                font-family="Arial, Helvetica, sans-serif" font-size="15"
                font-weight="700" textLength="162" lengthAdjust="spacing">CALIFORNIA</text>
          <text x="29" y="90" fill="currentColor"
                font-family="'Arial Black', Arial, Helvetica, sans-serif" font-size="28"
                font-weight="900" textLength="162" lengthAdjust="spacing">MODULAR</text>
        </svg>
      </a>

    </div>
  </section>

  <!-- Bottom: contact widget above footer links -->
  <div class="bottom">
    <div class="contact">
      <a href="/contact">Contact us</a>
    </div>
  </div>

</main>

<footer class="site-footer">
  <div class="footer-bar">
    <a class="wordmark footer-mark" href="https://gude.co" aria-label="Gude">
      <span class="gude">GUDE</span>
      <span class="rule"></span>
    </a>
    <div class="footer-end">
      <nav class="footer-links" aria-label="Legal">
        <a href="/privacy">Privacy Policy</a><span class="sep">|</span>
        <a href="/terms">Terms of Use</a><span class="sep">|</span>
        <a href="/contact">Contact Us</a>
      </nav>
      <p class="legal">&copy; 2016 Gude. All rights reserved.</p>
    </div>
  </div>
</footer>

</body>
</html>
