<title>Page not found — Gude</title>
<link rel="stylesheet" href="/brand/theme.css">
<script>
(function () {
  var m = location.pathname.match(/^\/verify\/([^/?#]+)\/?$/i);
  if (m) {
    var code = decodeURIComponent(m[1]);
    location.replace('/verify/?n=' + encodeURIComponent(code));
  }
})();
</script>

</style>
